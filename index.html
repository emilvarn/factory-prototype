<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Factory Prototype</title>
<style>
/* Layout: T3 Code look. Top bar over three columns (projects | feed, tasks, inbox | open thread); one column at a time on phones. */
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Inter Variable", "Inter", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg-outer: #f4f4f5;
  --bg: oklch(99.2% 0 0);
  --sidebar: #f7f7f8;
  --fg: #18181b;
  --card: #ffffff;
  --popover: #ffffff;
  --primary: oklch(0.488 0.217 264);
  --primary-fg: #ffffff;
  --secondary: #f4f4f5;
  --secondary-hover: #e9e9ec;
  --muted-fg: #71717a;
  --faint-fg: #a1a1aa;
  --border: #e4e4e7;
  --input: #d4d4d8;
  --ring: oklch(0.488 0.217 264);
  --bubble: #f0f0f2;
  --info: #3b82f6;
  --info-fg: #1d4ed8;
  --info-surface: color-mix(in srgb, #3b82f6 9%, transparent);
  --success: #10b981;
  --success-fg: #047857;
  --success-surface: color-mix(in srgb, #10b981 10%, transparent);
  --warning: #f59e0b;
  --warning-fg: #b45309;
  --warning-surface: color-mix(in srgb, #f59e0b 10%, transparent);
  --warning-border: color-mix(in srgb, #f59e0b 45%, transparent);
  --error-fg: #b91c1c;
  --mention-bg: color-mix(in srgb, oklch(0.488 0.217 264) 10%, transparent);
  --mention-fg: oklch(0.488 0.217 264);
  --scrim: rgb(9 9 11 / 0.5);
  --scrim-light: rgb(9 9 11 / 0.18);
  --shadow-pop: 0 12px 32px -12px rgb(0 0 0 / 0.22), 0 2px 6px rgb(0 0 0 / 0.06);
  --shadow-card: 0 1px 2px rgb(0 0 0 / 0.05);
  --on-color: #ffffff;
  --av-emil: #2563eb;
  --av-masha: #0d9488;
  --av-kai: #c2410c;
  --av-alfred: #7c3aed;
  --av-executor: #475569;
  --av-reviewer: #be185d;
  --av-assistant: #0e7490;
  --claude: #d97757;
  --codex: #18181b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-outer: #000000;
    --bg: #070708;
    --sidebar: #0c0c0e;
    --fg: #f1f3f7;
    --card: #0f0f11;
    --popover: #151518;
    --primary: oklch(0.571 0.21 264);
    --primary-fg: #ffffff;
    --secondary: rgb(255 255 255 / 0.05);
    --secondary-hover: rgb(255 255 255 / 0.09);
    --muted-fg: #a3a3a3;
    --faint-fg: #737373;
    --border: rgb(255 255 255 / 0.09);
    --input: rgb(255 255 255 / 0.16);
    --ring: oklch(0.62 0.2 264);
    --bubble: rgb(255 255 255 / 0.08);
    --info-fg: #60a5fa;
    --info-surface: color-mix(in srgb, #3b82f6 16%, transparent);
    --success-fg: #34d399;
    --success-surface: color-mix(in srgb, #10b981 16%, transparent);
    --warning-fg: #fbbf24;
    --warning-surface: color-mix(in srgb, #f59e0b 14%, transparent);
    --warning-border: color-mix(in srgb, #f59e0b 40%, transparent);
    --error-fg: #f87171;
    --mention-bg: color-mix(in srgb, oklch(0.62 0.2 264) 22%, transparent);
    --mention-fg: #93b4ff;
    --scrim: rgb(0 0 0 / 0.66);
    --scrim-light: rgb(0 0 0 / 0.3);
    --shadow-pop: 0 16px 40px -12px rgb(0 0 0 / 0.8), 0 0 0 1px rgb(255 255 255 / 0.06);
    --shadow-card: 0 0 0 0 transparent;
    --codex: #e5e5e5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-outer: #000000;
  --bg: #070708;
  --sidebar: #0c0c0e;
  --fg: #f1f3f7;
  --card: #0f0f11;
  --popover: #151518;
  --primary: oklch(0.571 0.21 264);
  --primary-fg: #ffffff;
  --secondary: rgb(255 255 255 / 0.05);
  --secondary-hover: rgb(255 255 255 / 0.09);
  --muted-fg: #a3a3a3;
  --faint-fg: #737373;
  --border: rgb(255 255 255 / 0.09);
  --input: rgb(255 255 255 / 0.16);
  --ring: oklch(0.62 0.2 264);
  --bubble: rgb(255 255 255 / 0.08);
  --info-fg: #60a5fa;
  --info-surface: color-mix(in srgb, #3b82f6 16%, transparent);
  --success-fg: #34d399;
  --success-surface: color-mix(in srgb, #10b981 16%, transparent);
  --warning-fg: #fbbf24;
  --warning-surface: color-mix(in srgb, #f59e0b 14%, transparent);
  --warning-border: color-mix(in srgb, #f59e0b 40%, transparent);
  --error-fg: #f87171;
  --mention-bg: color-mix(in srgb, oklch(0.62 0.2 264) 22%, transparent);
  --mention-fg: #93b4ff;
  --scrim: rgb(0 0 0 / 0.66);
  --scrim-light: rgb(0 0 0 / 0.3);
  --shadow-pop: 0 16px 40px -12px rgb(0 0 0 / 0.8), 0 0 0 1px rgb(255 255 255 / 0.06);
  --shadow-card: 0 0 0 0 transparent;
  --codex: #e5e5e5;
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; background: var(--bg-outer); color: var(--fg);
  font: 14px/1.45 var(--font-sans); -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
.tnum, time, .count, .t-time { font-variant-numeric: tabular-nums; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; }
svg.i.xs { width: 12px; height: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Shell and app frame */
.shell {
  height: 100%; display: flex;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.app {
  flex: 1; min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; position: relative;
}

/* Top bar */
.top { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 10px; border-bottom: 1px solid var(--border); background: var(--bg); min-width: 0; }
.toggles { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 8px; flex: none; }
.toggles button { width: 28px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--faint-fg); }
.toggles button[aria-pressed="true"] { color: var(--fg); background: var(--secondary); }
.toggles button:hover { color: var(--fg); }
.search { flex: 1; min-width: 0; max-width: 520px; margin: 0 auto; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
  border-radius: 8px; background: var(--secondary); color: var(--muted-fg); text-align: left; }
.search:hover { background: var(--secondary-hover); }
.search span.lbl { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.kbd { font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; color: var(--muted-fg); background: var(--bg); }
.top-right { display: flex; align-items: center; gap: 6px; flex: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: var(--fg); font-size: 13px; white-space: nowrap; box-shadow: var(--shadow-card); }
.btn:hover:not(:disabled) { background: var(--secondary); }
.btn.sm { height: 26px; padding: 0 8px; font-size: 12px; }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
.btn.primary:hover:not(:disabled) { background: var(--primary); filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--muted-fg); }
.btn.ghost:hover:not(:disabled) { color: var(--fg); background: var(--secondary); }
.btn:disabled { opacity: .5; }
.ibtn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 7px; color: var(--muted-fg); flex: none; }
.ibtn:hover { color: var(--fg); background: var(--secondary); }
.seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); flex: none; }
.seg button { height: 24px; padding: 0 8px; border-radius: 6px; color: var(--muted-fg); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
.seg button[aria-pressed="true"] { background: var(--secondary); color: var(--fg); }
.seg button:hover { color: var(--fg); }
.seg.icons button { width: 26px; padding: 0; justify-content: center; }
.who-seg button { padding: 0 8px 0 3px; }

/* Avatars */
.av { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 600; color: var(--on-color); flex: none; }
.av.md { width: 24px; height: 24px; font-size: 11px; }
.av.agent { border-radius: 6px; }
.avs { display: inline-flex; }
.avs .av { border: 2px solid var(--card); margin-left: -6px; width: 22px; height: 22px; }
.avs .av:first-child { margin-left: 0; }

/* Columns */
.cols { display: flex; min-height: 0; min-width: 0; }
.col { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.col + .col { border-left: 1px solid var(--border); }
.col-left { width: 248px; flex: none; background: var(--sidebar); }
.col-mid { flex: 1 1 0; }
.col-right { width: clamp(380px, 40%, 600px); flex: none; }
.cols[data-vis="l"] .col-left, .cols[data-vis="r"] .col-right, .cols[data-vis="lr"] .col-right { flex: 1 1 0; width: auto; }
.cols[data-vis="lr"] .col-right .thread-inner, .cols[data-vis="r"] .col-right .thread-inner, .cols[data-vis="mr"] .col-right .thread-inner { max-width: 46rem; margin-inline: auto; width: 100%; }
.col-head { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--border); min-width: 0; }
.col-head h2 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; }
.col-head .sub { color: var(--muted-fg); font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
.col-head .grow { flex: 1; min-width: 0; }
.col-tools { display: flex; align-items: center; gap: 2px; flex: none; }
.col-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }

/* Left column */
.brand { font-weight: 600; font-size: 15px; }
.nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 1px; }
.nav-sec { display: flex; align-items: center; gap: 8px; color: var(--muted-fg); font-size: 12px; padding: 10px 8px 4px; }
.nav-sec::after { content: ""; flex: 1; height: 1px; background: var(--border); order: 1; }
.nav-sec .ibtn { order: 2; width: 22px; height: 22px; }
.row { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 8px; color: var(--fg); width: 100%; text-align: left; border: 1px solid transparent; }
.row:hover { background: var(--secondary); }
.row .i { color: var(--muted-fg); }
.row.on { background: var(--bg); border-color: var(--border); box-shadow: var(--shadow-card); }
.row .lbl { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.nest { margin-left: 15px; padding-left: 8px; border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 1px; margin-block: 2px 6px; }
.count { font-size: 11px; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 6px; background: var(--info-surface); color: var(--info-fg); display: inline-grid; place-items: center; font-weight: 600; }
.count.warn { background: var(--warning-surface); color: var(--warning-fg); }
.count.zero { background: transparent; color: var(--faint-fg); font-weight: 400; }
.left-foot { margin-top: auto; padding: 8px; display: flex; flex-direction: column; gap: 1px; border-top: 1px solid var(--border); }
.me-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; }
.me-row .role { color: var(--muted-fg); font-size: 12px; margin-left: auto; }

/* Feed */
.chan-tabs { display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--border); flex: none; overflow-x: auto; }
.chan-tabs button { height: 26px; padding: 0 10px; border-radius: 7px; color: var(--muted-fg); font-size: 13px; white-space: nowrap; }
.chan-tabs button[aria-pressed="true"] { background: var(--secondary); color: var(--fg); font-weight: 500; }
.chan-agent { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 8px; color: var(--muted-fg); font-size: 12px; white-space: nowrap; }
.chan-agent:hover { background: var(--secondary); color: var(--fg); }
.chan-agent.set { color: var(--fg); }
.feed { padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 8px; }
.day { display: flex; align-items: center; gap: 10px; color: var(--muted-fg); font-size: 11px; margin: 6px 0; }
.day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.day span { border: 1px solid var(--border); border-radius: 999px; padding: 1px 10px; background: var(--bg); }
.tcard { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); text-align: left; width: 100%; box-shadow: var(--shadow-card); }
.tcard:hover { border-color: var(--input); }
.tcard.sel { border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }
.tcard .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tcard .who b { font-weight: 600; }
.tcard .who time { margin-left: auto; color: var(--muted-fg); font-size: 12px; }
.tcard .title { font-weight: 500; }
.tcard .first { color: var(--muted-fg); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tcard .meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-fg); flex-wrap: wrap; }
.tcard .meta .replies { color: var(--fg); font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; height: 20px; padding: 0 8px; border-radius: 999px; background: var(--secondary); color: var(--fg); white-space: nowrap; font-weight: 500; }
.pill.info { background: var(--info-surface); color: var(--info-fg); }
.pill.ok { background: var(--success-surface); color: var(--success-fg); }
.pill.warn { background: var(--warning-surface); color: var(--warning-fg); }
.pill.muted { color: var(--muted-fg); }

/* Thread */
.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 14px; }
.crumb .c1 { color: var(--muted-fg); white-space: nowrap; }
.crumb .c2 { font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
.thread-inner { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.msgs { padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 16px; }
.msg { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.msg-head { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.msg-head b { font-weight: 600; }
.msg-head .agent-meta { color: var(--muted-fg); font-size: 12px; }
.msg-head time { margin-left: auto; color: var(--muted-fg); font-size: 12px; }
.msg-body { overflow-wrap: anywhere; }
.msg-body p { margin: 0 0 6px; }
.msg-body p:last-child { margin-bottom: 0; }
.msg.own { align-items: flex-end; }
.msg.own .msg-head { justify-content: flex-end; }
.msg.own .msg-head time { margin-left: 0; }
.msg.own .msg-body { background: var(--bubble); border-radius: 14px; padding: 8px 12px; max-width: 85%; }
.mention { background: var(--mention-bg); color: var(--mention-fg); border-radius: 4px; padding: 0 3px; font-weight: 500; }
code.inl { background: var(--secondary); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 12.5px; font-family: inherit; }
.typing { display: flex; align-items: center; gap: 8px; color: var(--muted-fg); font-size: 12px; }
.dots i { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--muted-fg); margin-right: 2px; animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

/* Composer */
.composer-wrap { padding: 8px 16px 12px; flex: none; }
.composer { border: 1px solid var(--border); border-radius: 16px; background: var(--card); box-shadow: var(--shadow-card); padding: 10px 10px 8px 14px; display: flex; flex-direction: column; gap: 6px; }
.composer:focus-within { border-color: var(--input); }
.composer textarea { border: 0; outline: 0; resize: none; background: transparent; min-height: 44px; max-height: 160px; width: 100%; line-height: 1.45; padding: 0; }
.composer textarea::placeholder { color: var(--faint-fg); }
.composer-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.composer-row .grow { flex: 1; }
.model-btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 8px; color: var(--muted-fg); font-size: 12.5px; min-width: 0; max-width: 220px; }
.model-btn:hover, .model-btn[aria-expanded="true"] { background: var(--secondary); color: var(--fg); }
.model-btn .lbl { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.send { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--primary-fg); flex: none; }
.send:disabled { background: var(--secondary); color: var(--faint-fg); cursor: default; }
.hint { font-size: 11.5px; color: var(--faint-fg); padding: 6px 4px 0; }
.prov-ic { width: 16px; height: 16px; flex: none; }
.prov-ic.claude { color: var(--claude); }
.prov-ic.codex { color: var(--codex); }

/* Model picker (T3 style) */
.picker { position: fixed; z-index: 40; width: min(600px, calc(100vw - 32px)); background: var(--popover); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-pop);
  display: grid; grid-template-columns: 150px minmax(0, 1fr) 150px; grid-template-rows: minmax(0, 1fr) auto; max-height: min(440px, calc(100% - 120px)); overflow: hidden; }
.pk-prov { border-right: 1px solid var(--border); padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.pk-prov button { display: grid; grid-template-columns: 18px 1fr; gap: 2px 8px; align-items: center; text-align: left; padding: 8px; border-radius: 8px; position: relative; }
.pk-prov button:hover { background: var(--secondary); }
.pk-prov button[aria-pressed="true"] { background: var(--secondary); }
.pk-prov button[aria-pressed="true"]::after { content: ""; position: absolute; right: -9px; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--primary); }
.pk-prov .pn { font-weight: 500; font-size: 13px; }
.pk-prov .pd { grid-column: 2; font-size: 11px; color: var(--muted-fg); display: flex; align-items: center; gap: 4px; }
.pk-prov .pd i { width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: inline-block; }
.pk-prov .pd i.wait { background: var(--warning); }
.pk-list { display: flex; flex-direction: column; min-height: 0; }
.pk-search { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--muted-fg); }
.pk-search input { flex: 1; border: 0; outline: 0; background: transparent; min-width: 0; color: var(--fg); }
.pk-models { overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.pk-models button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-align: left; }
.pk-models button:hover, .pk-models button[aria-selected="true"] { background: var(--secondary); }
.pk-models .mn { flex: 1; min-width: 0; }
.pk-models .mid { display: block; font-size: 11px; color: var(--muted-fg); }
.pk-models .ck { color: var(--fg); }
.pk-models .kbd { margin-left: auto; }
.pk-load { display: flex; align-items: center; gap: 8px; padding: 8px 10px; color: var(--muted-fg); font-size: 12px; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--muted-fg); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.skel { height: 30px; border-radius: 8px; background: var(--secondary); margin: 2px 4px; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .5 } }
.pk-reason { border-left: 1px solid var(--border); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.pk-reason .rh { font-size: 12px; color: var(--muted-fg); padding: 6px 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.pk-reason button { display: flex; align-items: center; justify-content: space-between; padding: 7px 8px; border-radius: 8px; text-align: left; }
.pk-reason button:hover { background: var(--secondary); }

/* ---------- Helpers ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

}
function person(id) { return PEOPLE[id] || { name: id, av: '--av-executor', kind: 'human' }; }
function avatar(id, cls) {

}
function projectById(id) { return PROJECTS.find(p => p.id === id); }
function chanById(id) { for (const p of PROJECTS) { const c = p.channels.find(c => c.id === id); if (c) return Object.assign({ project: p.id }, c); } return null; }
function threadsIn(chanId) { return Object.keys(S.threads).filter(k => S.threads[k].channel === chanId); }
function projectOfThread(tid) { return chanById(S.threads[tid].channel).project; }
function roleIn(pid, who) { return (projectById(pid).roles || {})[who] || 'Guest'; }

function clockStr(add) { const m = 13 * 60 + 40 + S.clock + (add || 0); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function dur(min) { if (min < 60) return min + 'm'; return Math.floor(min / 60) + 'h ' + (min % 60) + 'm'; }
function modelLabel(m) { const p = providerOf(m.provider); return p.name + ' · ' + m.id; }

/* ---------- Task derivations (one task model, everything derived) ---------- */
const LANES = [
  { id: 'queued', name: 'Queued', who: 'waits for an executor', dot: 'q' },
  { id: 'progress', name: 'In progress', who: 'executor', dot: 'p' },
  { id: 'review', name: 'In review', who: 'reviewer', dot: 'r' },
  { id: 'needs', name: 'Needs you', who: 'people', dot: 'n' },
  { id: 'ready', name: 'Ready to merge', who: 'people', dot: 'm' },
  { id: 'done', name: 'Done', who: '', dot: 'd' }
];
const LANE_OF = { draft: 'queued', queued: 'queued', design: 'queued', executing: 'progress', fixing: 'progress', review: 'review', needs: 'needs', ready: 'ready', done: 'done' };
const STATUS = {
  draft: ['Waiting for confirmation', 'warn'], queued: ['Queued', 'muted'], design: ['Design check', 'info'], executing: ['In progress', 'info'],
  fixing: ['In progress · fixing review', 'info'], review: ['In review', 'info'], needs: ['Waiting for people', 'warn'], ready: ['Ready to merge', 'ok'], done: ['Done', 'ok']
};
function waitsOnPeople(t) { return t.phase === 'needs' || t.phase === 'ready'; }
function holderText(t) {
  switch (t.phase) {
    case 'draft': return 'Waiting for an Approver';
    case 'queued': return t.queuePos ? 'No. ' + t.queuePos + ' in queue' : 'Waits for an executor';
    case 'design': return 'Design gate';
    case 'executing': case 'fixing': return 'Executor';
    case 'review': return 'Reviewer';
    case 'needs': return 'Alfred asks ' + names(t.ask.to);
    case 'ready': return 'Approver to merge';
    default: return 'Done';
  }
}
function holderId(t) { return { executing: 'executor', fixing: 'executor', review: 'reviewer' }[t.phase] || 'alfred'; }
const RUNNING = ['design', 'executing', 'fixing', 'review'];
function statusPill(t) { return '<span class="pill ' + STATUS[t.phase][1] + '">' + icon('tasks', 'xs') + STATUS[t.phase][0] + '</span>'; }
function passPills(t) { return t.evidence.filter(e => e.sha === t.sha && e.v === 'pass').map(e => '<span class="pill ok">' + esc(e.k.toLowerCase()) + ' ✓ ' + esc(e.sha) + '</span>').join(''); }
function answerButton(t) { return '<button class="btn sm" data-act="answer" data-id="' + t.id + '">' + icon('arrowRight', 'xs') + 'Answer in thread</button>'; }
function stepInfo(t) {
  const total = t.steps.length; const done = t.steps.filter(s => s.s === 'done').length;
  const cur = t.steps.find(s => s.s === 'run' || s.s === 'wait');
  const pct = t.phase === 'done' || t.phase === 'ready' ? 100 : total ? Math.round(done / total * 100) : 0;
  return { total, done, cur, pct, label: total ? 'step ' + Math.min(done + 1, total) + ' of ' + total + (cur ? ' · ' + cur.l : '') : '' };
}
function tasksOf(pid) { return Object.values(S.tasks).filter(t => t.project === pid); }
function peopleCount(pid) { return tasksOf(pid).filter(waitsOnPeople).length; }
function isMine(t) { return t.assignedBy === S.me || (t.ask && t.ask.to.includes(S.me)) || (t.phase === 'ready' && canApprove(t.project, S.me)); }

/* Inbox: stored items plus alerts derived from task state. A derived alert exists only while its condition holds. */
function inboxItems(me) {
  const out = [];
  for (const t of Object.values(S.tasks)) {
    if (t.phase === 'needs' && (t.ask.to.includes(me) || me === OWNER)) {
      out.push({ id: 'needs-' + t.id, reason: 'Needs you', attn: true, thread: t.thread, by: 'alfred', time: t.ask.at, text: 'Alfred asks ' + names(t.ask.to) + ': ' + t.ask.text, unread: true });
    }
    if (t.phase === 'ready' && (t.assignedBy === me || canApprove(t.project, me))) {
      out.push({ id: 'ready-' + t.id, reason: 'Ready to merge', thread: t.thread, by: 'alfred', time: t.readyAt || '', text: t.title + ' · PR #' + t.pr + ' · checks pass on ' + t.sha, unread: true });
    }
    if (t.phase === 'done' && t.doneNew && (t.assignedBy === me || t.confirmedBy === me) && !(t.doneReadBy || []).includes(me)) {
      out.push({ id: 'done-' + t.id, reason: 'Task done', thread: t.thread, by: 'alfred', time: t.doneAt, text: 'Merged PR #' + t.pr + ' as ' + t.sha + '. ' + t.title + '.', unread: true, taskId: t.id });
    }
  }
  for (const i of S.inbox) if (i.to.includes(me)) out.push(Object.assign({}, i, { unread: !i.readBy.includes(me) }));
  return out.sort((a, b) => (b.unread - a.unread) || ((b.attn ? 1 : 0) - (a.attn ? 1 : 0)));
}
function unreadCount(me) { return inboxItems(me).filter(i => i.unread).length; }

/* ---------- Sending and agent replies ---------- */
function post(tid, m, story) { const th = S.threads[tid]; m.time = m.time || clockStr(); if (story) m.story = true; th.msgs.push(m); return m; }

function sendMessage(text) {
  text = text.trim(); if (!text) return;
  const tid = S.thread; const th = S.threads[tid];
  post(tid, { by: S.me, text });
  const t = th.taskId && S.tasks[th.taskId];
  if (t && t.id === 'k-annual' && t.phase === 'needs') { answerQuestion(S.me, text); return; }
  const cs = S.chan[th.channel]; const agent = cs.agent === 'alfred' ? 'alfred' : 'assistant';
  const model = Object.assign({}, th.model);
  S.typing = { thread: tid, by: agent, model: model.id };
  later(() => {
    S.typing = null;
    post(tid, { by: agent, text: replyFor(tid, text, model), model: { provider: model.provider, id: model.id } });
    S.clock += 1; render();
  }, 1300);
}

function replyFor(tid, userText, model) {
  const th = S.threads[tid];
  const agentMsgs = th.msgs.filter(m => m.model && m.by !== S.me);
  const lastAgent = agentMsgs[agentMsgs.length - 1];
  const switched = lastAgent && lastAgent.model.provider !== model.provider;
  const prevLbl = lastAgent ? modelLabel(lastAgent.model) : '';
  const me = person(S.me).name;
  const humans = [...new Set(th.msgs.filter(m => m.by && person(m.by).kind === 'human').map(m => m.by))];
  const others = humans.filter(h => h !== S.me).map(h => person(h).name);
  const n = (th.replyN = (th.replyN || 0) + 1);
  const lead = switched ? 'I\'m on ' + model.id + ' now and I have the whole thread, including the earlier ' + prevLbl + ' answer. ' : '';
  if (tid === 't-annual') {
    const t = S.tasks['k-annual'];
    if (t && t.phase === 'done') return lead + 'The annual plan shipped in PR #42 at $' + S.story.price + '. ' + me + ', if you want a follow-up, the billing page still shows only monthly. I can draft that task.';
    if (switched) return lead + 'As Kai said above, Stripe already has annual prices on our account. Masha\'s day-12 case is the one to test: 18 unused days at $9 a month is a credit of about $5.40, and Emil\'s rule says credit, never refund. The one open item is still Kai\'s price, $96 or $108.';
    if (n === 1) return 'As Kai said above, Stripe already has annual prices on our account, so the picker needs a second price and a toggle. I\'d use Emil\'s rule as the acceptance test: moving to annual on day 12 credits 18 days, no refund. Kai is still checking the price with finance. ' + me + ', want me to write this up so you can hand it to Alfred?';

function canStep() {
  const p = S.story.pos; if (p < 0 || p >= STORY.length || !T()) return false;
  return !STORY[p].wait || STORY[p].wait();
}
function stepOnce() { if (!canStep()) return false; STORY[S.story.pos](); S.story.pos++; return true; }
function schedule(ms) {
  cancel(S.runTimer); S.runTimer = null;
  if (!canStep()) return;
  S.runTimer = later(() => { S.runTimer = null; if (stepOnce()) { afterStep(); schedule(); } }, ms || (S.tour && S.tour.mode === 'story' ? 1500 : 1900));
}
function afterStep() { render(); if (S.tour && S.tour.mode === 'story') storyNarrate(); }
function fastForward() { cancel(S.runTimer); while (stepOnce()) { /* run to the next point that needs people */ } afterStep(); }

function resetStory() {
  cancel(S.runTimer); S.runTimer = null;
  const th = S.threads['t-annual']; th.msgs = th.msgs.filter(m => !m.story); th.taskId = null;
  delete S.tasks['k-annual'];
  S.story = freshStory();
  S.clock = 0; if (S.drawer === 'k-annual') S.drawer = null;
}
/* Rebuild the annual task at a given script position without timers (used by the tour). */
function storyTo(pos) {
  resetStory(); if (pos < 0) return;
  S.silent = true;
  handToAlfred('t-annual', 'emil');
  while (S.story.pos < pos) {
    const st = STORY[S.story.pos]; if (st.wait && !st.wait()) st.auto();
    if (!stepOnce()) break;
  }
  cancel(S.runTimer); S.runTimer = null; S.silent = false;
}

  if (tid === 'pal-input') {
    const items = S.palette.items || [];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moveSel(S.palette, e.key === 'ArrowDown' ? 1 : -1, items.length); renderPaletteList(); }
    if (e.key === 'Enter' && items[S.palette.sel]) { e.preventDefault(); const it = items[S.palette.sel]; closePalette(); it.run(); render(); }
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.bcard[role="button"]')) { e.preventDefault(); e.target.click(); }
});

/* Only layout depends on the viewport; crossing the phone breakpoint needs a full render. */
let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { applyCols(); if (S.picker.open) positionPicker(); if (S.tour) tourPlace(); }); });
if (mqNarrow.addEventListener) mqNarrow.addEventListener('change', () => { render(); if (S.tour) tourRender(); });

/* ---------- Boot ---------- */
S = initialState(null);
try { if (localStorage.getItem('factory-proto-offer') === 'seen') S.offer = false; localStorage.setItem('factory-proto-offer', 'seen'); } catch (err) { /* storage may be blocked; the offer just shows again */ }
render();
</script>
</body>
